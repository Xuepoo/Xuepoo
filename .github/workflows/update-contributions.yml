name: Update External Contributions

on:
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Query External Merged PRs and Update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Fetch up to 30 latest merged PRs in external repositories (excluding personal and own org repos)
          prs_json=$(gh search prs \
            --author="${{ github.repository_owner }}" \
            --merged \
            --limit 30 \
            --json repository \
            -- "-user:${{ github.repository_owner }}" "-owner:vectojs" "-owner:vemjs" "-owner:bitty-terminal")

          # Format into markdown table
          python3 -c "
          import json, re, subprocess

          raw = '''$prs_json'''
          try:
              data = json.loads(raw)
          except Exception:
              data = []

          # Extract unique repositories
          repo_names = []
          seen = set()
          for item in data:
              name = item.get('repository', {}).get('nameWithOwner')
              if name and name not in seen:
                  seen.add(name)
                  repo_names.append(name)

          header = '| Repository | Language | Description |\n| :--- | :---: | :--- |'
          if not repo_names:
              table = f'{header}\n| *No external contributions recorded yet* | - | - |'
          else:
              rows = [header]
              for repo in repo_names:
                  try:
                      res = subprocess.run(['gh', 'repo', 'view', repo, '--json', 'description,primaryLanguage'], capture_output=True, text=True)
                      meta = json.loads(res.stdout) if res.stdout else {}
                  except Exception:
                      meta = {}
                  lang = meta.get('primaryLanguage', {}).get('name') if meta.get('primaryLanguage') else 'Unknown'
                  desc = (meta.get('description') or '').strip().replace('|', '-')
                  rows.append(f'| [**{repo}**](https://github.com/{repo}) | \`{lang}\` | {desc} |')
              table = '\n'.join(rows)

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          pattern = r'(<!-- EXTERNAL_CONTRIBUTIONS:START -->).*?(<!-- EXTERNAL_CONTRIBUTIONS:END -->)'
          replacement = f'<!-- EXTERNAL_CONTRIBUTIONS:START -->\n{table}\n<!-- EXTERNAL_CONTRIBUTIONS:END -->'
          new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(new_content)
          "

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(profile): sync external contributions [skip ci]"
            git push
          fi
