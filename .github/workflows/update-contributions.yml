name: Update External Contributions

on:
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Query External Merged PRs and Update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Fetch up to 10 latest merged PRs in external repositories
          prs_json=$(gh search prs \
            --author="${{ github.repository_owner }}" \
            --merged \
            "NOT user:${{ github.repository_owner }}" \
            --limit 10 \
            --json title,url,repository,closedAt)

          # Format into markdown table
          python3 -c "
          import json, re

          raw = '''$prs_json'''
          try:
              data = json.loads(raw)
          except Exception:
              data = []

          header = '| Repository | Contribution / PR | Merged Date |\n| :--- | :--- | :---: |'
          if not data:
              table = f'{header}\n| *No external contributions recorded yet* | - | - |'
          else:
              rows = [header]
              for item in data:
                  repo = item.get('repository', {}).get('nameWithOwner', '')
                  title = item.get('title', '').strip().replace('|', '-')
                  url = item.get('url', '')
                  date = (item.get('closedAt') or '')[:10]
                  rows.append(f'| [**{repo}**](https://github.com/{repo}) | [{title}]({url}) | \`{date}\` |')
              table = '\n'.join(rows)

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          pattern = r'(<!-- EXTERNAL_CONTRIBUTIONS:START -->).*?(<!-- EXTERNAL_CONTRIBUTIONS:END -->)'
          replacement = f'<!-- EXTERNAL_CONTRIBUTIONS:START -->\n{table}\n<!-- EXTERNAL_CONTRIBUTIONS:END -->'
          new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(new_content)
          "

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(profile): sync external contributions [skip ci]"
            git push
          fi
